spring.application.name=auditlens-portal
server.port=8080

# Local demo database (H2 file, SQL Server compatibility mode).
# To switch to SQL Server Express later, replace these three lines (see README).
spring.datasource.url=jdbc:h2:file:./data/auditlens;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Where uploaded files are stored. Stand-in for the S3 bucket.
auditlens.storage-dir=./storage
# Folder of prepared CUAD test contracts (<id>.txt + <id>.snippets.json)
auditlens.cuad-dir=${AUDITLENS_CUAD_DIR:../../demo_data/cuad}
# FastAPI classifier service (nlp/serve.py)
auditlens.classifier-url=http://localhost:8000
# Show demo account hints on the sign-in page. Turn off for anything beyond a demo.
auditlens.demo-hints=true
